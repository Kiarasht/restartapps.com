name: Update app download counts

on:
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-app-download-counts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update download counts
        run: npm run update-downloads
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_VENDOR_NUMBER: ${{ secrets.APPLE_VENDOR_NUMBER }}

      - name: Verify site
        run: npm run build

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- src/data/download-counts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated counts
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/download-counts.json
          git commit -m "Update app download counts"
          git push
